<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPECT Bassin d'Issoudun 2026 — Diagnostic emploi-compétences</title>
<script>window.addEventListener('error',function(e){try{var p=document.getElementById('page')||document.body;if(!p)return;p.innerHTML='<div style="padding:22px;margin:18px;border:2px solid #D2562F;border-radius:12px;background:#fff;font:13px/1.6 ui-monospace,monospace;color:#b00;white-space:pre-wrap">⚠ Erreur JavaScript&#10;'+((e&&(e.message||e.error))||'?')+'&#10;ligne '+((e&&e.lineno)||'?')+' · colonne '+((e&&e.colno)||'?')+'</div>';}catch(_){}}, true);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --petrole:#0C3B43; --petrole-2:#114E58; --petrole-3:#0A2C32; --petrole-deep:#072025;
  --emeraude:#0FA37F; --emeraude-2:#13BD92; --emeraude-soft:#D6F0E7;
  --ambre:#E0A22B; --ambre-2:#F2B544; --ambre-soft:#FBEAC9;
  --corail:#D2562F; --corail-soft:#F7DDD2;
  --cream:#F6F3EC; --cream-2:#EFEAE0; --paper:#FFFFFF;
  --ink:#13211F; --ink-soft:#4A5754; --line:#E2DCCF; --line-2:#ECE7DB;
  --shadow:0 1px 2px rgba(12,59,67,.04),0 8px 26px rgba(12,59,67,.07);
  --shadow-lg:0 24px 60px rgba(12,59,67,.16);
  --r:18px; --r-sm:12px; --sidebar:280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px}
h1,h2,h3,h4,.serif{font-family:'Fraunces',Georgia,serif}
a{color:inherit;text-decoration:none}
::selection{background:var(--emeraude);color:#fff}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:linear-gradient(180deg,var(--petrole-3),var(--petrole-deep));color:#EAF4F1;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:60;border-right:1px solid rgba(255,255,255,.06)}
.brand{padding:26px 24px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--emeraude),var(--ambre));display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:700;color:#06262b;font-size:20px;flex:0 0 auto;box-shadow:0 6px 16px rgba(15,163,127,.35)}
.brand .t1{font-family:'Fraunces';font-weight:600;font-size:16px;letter-spacing:.2px;line-height:1.15;color:#fff}
.brand .t2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ambre-2);margin-top:3px;font-weight:600}
nav{flex:1;overflow-y:auto;padding:14px 14px 10px}
nav::-webkit-scrollbar{width:7px}nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}
.nav-group{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,244,241,.42);margin:16px 12px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;cursor:pointer;color:#CFE2DD;font-weight:500;font-size:13.7px;transition:.16s;position:relative;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(100deg,rgba(15,163,127,.26),rgba(15,163,127,.08));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:0 4px 4px 0;background:var(--emeraude-2)}
.nav-item .ni-ic{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.nav-item.active .ni-ic{background:var(--emeraude);color:#06262b}
.nav-item .ni-badge{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:20px;letter-spacing:.02em}
.nav-item .soon{margin-left:auto;font-size:9px;font-weight:700;background:var(--ambre);color:#3a2a05;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.side-foot{padding:14px 22px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(234,244,241,.5);line-height:1.5}
.side-foot b{color:#cfe2dd;font-weight:600}

#main{margin-left:var(--sidebar);flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:38px 44px 90px}
.topbar{display:none}

/* ---------- Hero ---------- */
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(125deg,var(--petrole-3) 0%,var(--petrole) 52%,var(--petrole-2) 100%);color:#fff;padding:46px 46px 42px;box-shadow:var(--shadow-lg);margin-bottom:30px}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(15,163,127,.55),transparent 62%)}
.hero::before{content:"";position:absolute;right:60px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(224,162,43,.4),transparent 60%)}
.hero .eyebrow{position:relative;z-index:2;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ambre-2);font-weight:700;margin-bottom:14px}
.hero h1{position:relative;z-index:2;font-size:clamp(30px,4.2vw,50px);line-height:1.04;font-weight:600;letter-spacing:-.5px;max-width:18ch}
.hero p.lead{position:relative;z-index:2;margin-top:16px;max-width:62ch;color:#CFE6DF;font-size:16.5px}
.hero .hero-meta{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hero .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:7px 14px;border-radius:30px;font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}
.hero .chip b{color:var(--ambre-2)}

/* ---------- Page header ---------- */
.page-head{margin:6px 0 26px;position:relative}
.page-head .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--emeraude);margin-bottom:8px}
.page-head h2{font-size:clamp(26px,3.3vw,38px);font-weight:600;letter-spacing:-.4px;line-height:1.08;color:var(--petrole-3)}
.page-head .sub{margin-top:10px;color:var(--ink-soft);max-width:74ch;font-size:15.5px}
.page-head .nbadge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:var(--paper);border:1px solid var(--line);padding:6px 13px;border-radius:30px;font-size:12.5px;font-weight:600;color:var(--petrole);box-shadow:var(--shadow)}
.page-head .nbadge .dot{width:8px;height:8px;border-radius:50%;background:var(--emeraude)}

/* ---------- Sections / cards ---------- */
.section{margin:34px 0}
.section-title{display:flex;align-items:center;gap:13px;font-size:20px;font-weight:600;color:var(--petrole-3);margin-bottom:4px;letter-spacing:-.2px}
.section-title .st-num{font-family:'Fraunces';font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--petrole),var(--petrole-2));min-width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.section-desc{color:var(--ink-soft);margin:7px 0 18px;max-width:80ch;font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.card.tight{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}

/* chart card */
.ch-head{margin-bottom:6px}
.ch-q{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--emeraude);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-q .qn{background:var(--emeraude-soft);color:#0a6b53;padding:2px 8px;border-radius:6px}
.ch-title{font-size:16px;font-weight:600;color:var(--petrole-3);margin:7px 0 2px;line-height:1.25;font-family:'Fraunces'}
.ch-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.chart-wrap{position:relative;width:100%}
.analysis{margin-top:14px;padding:13px 15px 13px 16px;background:var(--cream);border-radius:12px;border-left:3px solid var(--emeraude);font-size:13.7px;color:#27433d}
.analysis b{color:var(--petrole-3);font-weight:700}
.src{margin-top:9px;font-size:11px;color:#8a948f;font-style:italic}

/* KPI */
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:80px;height:80px;border-radius:50%;opacity:.1;background:var(--emeraude)}
.kpi.amber::after{background:var(--ambre)}.kpi.petrol::after{background:var(--petrole)}.kpi.coral::after{background:var(--corail)}
.kpi .kv{font-family:'Fraunces';font-size:38px;font-weight:600;line-height:1;color:var(--petrole-3);letter-spacing:-1px}
.kpi.amber .kv{color:var(--ambre)}.kpi.emer .kv{color:var(--emeraude)}.kpi.coral .kv{color:var(--corail)}
.kpi .kl{font-size:13px;color:var(--ink);margin-top:9px;font-weight:600;line-height:1.25}
.kpi .ks{font-size:11.5px;color:var(--ink-soft);margin-top:4px}

/* insight callouts */
.insight{border-radius:var(--r);padding:18px 20px 18px 22px;position:relative;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.insight .ih{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-bottom:6px}
.insight .ih .tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:20px;font-weight:800}
.insight p{font-size:13.8px;color:#2c3a37}
.insight.gap{border-left:5px solid var(--ambre)} .insight.gap .tag{background:var(--ambre-soft);color:#8a5e07}
.insight.risk{border-left:5px solid var(--corail)} .insight.risk .tag{background:var(--corail-soft);color:#9a3414}
.insight.signal{border-left:5px solid var(--emeraude)} .insight.signal .tag{background:var(--emeraude-soft);color:#0a6b53}
.insight.lever{border-left:5px solid var(--petrole)} .insight.lever .tag{background:#d9e6e6;color:var(--petrole-3)}
.hyp{display:inline-block;font-size:10.5px;font-weight:700;background:var(--ambre-soft);color:#8a5e07;padding:2px 9px;border-radius:6px;letter-spacing:.03em;margin-left:6px;vertical-align:middle}

/* verbatim */
.vb{background:linear-gradient(180deg,#fff,#fbf9f3);border:1px solid var(--line);border-left:4px solid var(--emeraude);border-radius:12px;padding:13px 16px 13px 17px;font-size:13.6px;color:#33433f;font-style:italic;position:relative}
.vb::before{content:"\201C";font-family:'Fraunces';position:absolute;top:-6px;left:8px;font-size:30px;color:var(--emeraude);opacity:.28;font-style:normal}
.vb-grid{display:grid;gap:11px}

/* theme chips */
.themes{display:flex;flex-wrap:wrap;gap:8px}
.theme{display:inline-flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:30px;padding:6px 8px 6px 13px;font-size:12.8px;font-weight:600;color:var(--petrole-3)}
.theme .tn{background:var(--petrole);color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700}
.theme.hot .tn{background:var(--corail)} .theme.warm .tn{background:var(--ambre);color:#3a2a05}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper)}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line-2)}
th{background:var(--petrole-3);color:#eaf4f1;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#fbfaf6}
tbody tr:hover{background:var(--emeraude-soft)}
.bar-cell{position:relative}
.mini-bar{height:7px;border-radius:5px;background:var(--emeraude);display:inline-block;vertical-align:middle}

/* convergence/divergence list */
.cd{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px dashed var(--line)}
.cd:last-child{border-bottom:none}
.cd .ic{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.cd .ic.cv{background:var(--emeraude)} .cd .ic.dv{background:var(--ambre);color:#3a2a05}
.cd h4{font-size:15px;font-weight:700;color:var(--petrole-3);margin-bottom:3px;font-family:'Hanken Grotesk'}
.cd p{font-size:13.6px;color:#33433f}

/* gap viz */
.gapviz{display:grid;grid-template-columns:1fr;gap:9px;margin-top:6px}
.gaprow{display:grid;grid-template-columns:200px 1fr 54px;align-items:center;gap:12px}
.gaprow .gl{font-size:13px;font-weight:600;color:var(--petrole-3)}
.gaptrack{height:14px;background:var(--cream-2);border-radius:10px;position:relative;overflow:hidden}
.gapfill{height:100%;border-radius:10px}
.gaprow .gv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
@media(max-width:680px){.gaprow{grid-template-columns:120px 1fr 44px}.gaprow .gl{font-size:11.5px}}

/* levier cards */
.levier{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.levier .lh{padding:18px 20px;background:linear-gradient(120deg,var(--petrole-3),var(--petrole-2));color:#fff;position:relative}
.levier .lh .ln{font-family:'Fraunces';font-size:13px;font-weight:600;color:var(--ambre-2);letter-spacing:.05em}
.levier .lh h4{font-size:17px;font-weight:600;margin-top:4px;font-family:'Fraunces';line-height:1.2}
.levier .lb{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column;gap:11px}
.levier .lb p{font-size:13.6px;color:#33433f}
.levier .ev{margin-top:auto;padding-top:11px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-soft)}
.levier .ev b{color:var(--petrole-3)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.minitag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--emeraude-soft);color:#0a6b53;letter-spacing:.02em}

/* action plan */
.axis{margin:22px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
.axis .ax-head{padding:20px 24px;background:linear-gradient(120deg,var(--petrole-3),var(--petrole));color:#fff;display:flex;gap:16px;align-items:center}
.axis .ax-head .axn{font-family:'Fraunces';font-size:26px;font-weight:600;width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
.axis .ax-head h3{font-size:21px;font-weight:600;font-family:'Fraunces'}
.axis .ax-head .axs{font-size:13px;color:#cfe6df;margin-top:3px}
.fiche{padding:20px 24px;border-top:1px solid var(--line-2)}
.fiche .ft{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.fiche .fcode{font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--ambre);color:#3a2a05;padding:3px 9px;border-radius:6px}
.fiche h4{font-size:17px;font-weight:700;color:var(--petrole-3);font-family:'Fraunces'}
.fiche .obj{font-size:14px;color:#2c3a37;margin:8px 0 14px}
.fiche .meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:760px){.fiche .meta-grid{grid-template-columns:1fr}.axis .ax-head{padding:16px}}
.mline{font-size:13px;display:flex;gap:9px}
.mline .mk{font-weight:700;color:var(--petrole);min-width:104px;flex:0 0 auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.mline .mv{color:#33433f}
.pri{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:20px}
.pri.p1{background:var(--corail-soft);color:#9a3414}.pri.p2{background:var(--ambre-soft);color:#8a5e07}.pri.p3{background:var(--emeraude-soft);color:#0a6b53}
.horizon{display:inline-block;font-size:11px;font-weight:700;color:var(--petrole);background:#d9e6e6;padding:3px 10px;border-radius:20px}

/* misc */
.divider{height:1px;background:var(--line);margin:30px 0}
.note-box{background:var(--ambre-soft);border:1px solid #e9cf95;border-radius:14px;padding:15px 18px;font-size:13.4px;color:#6a4a08}
.note-box b{color:#553a06}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.soon-wrap{text-align:center;padding:70px 30px}
.soon-wrap .ic{font-size:46px;margin-bottom:14px}
.soon-wrap h2{font-size:30px;color:var(--petrole-3);font-weight:600}
.soon-wrap p{max-width:60ch;margin:14px auto 0;color:var(--ink-soft)}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* mobile */
.hamb{display:none}
.backdrop{display:none}
@media(max-width:1000px){
  #sidebar{transform:translateX(-100%);transition:.28s;box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:none}
  #main{margin-left:0}
  .wrap{padding:18px 18px 80px}
  .topbar{display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:40;background:rgba(246,243,236,.92);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid var(--line)}
  .hamb{display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:8px;border-radius:9px;background:var(--petrole-3)}
  .hamb i{width:20px;height:2.4px;background:#fff;border-radius:2px;display:block}
  .topbar .tb-t{font-family:'Fraunces';font-weight:600;color:var(--petrole-3);font-size:15px}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(7,32,37,.45);z-index:55}
  .g2{grid-template-columns:1fr}.span2{grid-column:auto}
  .hero{padding:32px 24px}
}
@media(max-width:560px){.g3,.g4{grid-template-columns:1fr}}

/* ═══════════════ PREMIUM OVERRIDES v10 ═══════════════ */
:root{--shadow-md:0 3px 8px rgba(12,59,67,.06),0 14px 38px rgba(12,59,67,.10);--ease:cubic-bezier(.22,.8,.32,1)}

/* — interactions générales — */
.card,.kpi,.insight{transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
button{transition:transform .15s var(--ease),box-shadow .15s var(--ease),filter .15s var(--ease)}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button:active{transform:translateY(0)}
:focus-visible{outline:3px solid var(--emeraude-2);outline-offset:2px;border-radius:6px}
.fade{animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* — hero : motif discret — */
.hero{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px),linear-gradient(125deg,var(--petrole-3) 0%,var(--petrole) 52%,var(--petrole-2) 100%);background-size:26px 26px,cover}

/* — page head : trait dégradé — */
.page-head h2{position:relative;padding-bottom:14px}
.page-head h2::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--emeraude),var(--ambre))}

/* — sections : pastille + filet — */
.section-title .st-num{background:linear-gradient(135deg,var(--emeraude) 0%,var(--petrole) 90%);box-shadow:0 4px 12px rgba(15,163,127,.28);border-radius:10px}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-left:6px}

/* — KPI : liseré + chiffre plus fort — */
.kpi{padding-left:23px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--emeraude);border-radius:0 4px 4px 0;opacity:.9}
.kpi.amber::before{background:var(--ambre)}.kpi.petrol::before{background:var(--petrole)}.kpi.coral::before{background:var(--corail)}
.kpi .kv{font-size:42px}
.kpi .ks{line-height:1.35}

/* — insights : icône par tonalité — */
.insight{position:relative;padding-left:56px!important;background:var(--paper)}
.insight::before{position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:30px;text-align:center}
.insight.gap::before{content:"⇄";background:var(--ambre-soft);color:#8a5f0d}
.insight.risk::before{content:"⚠";background:var(--corail-soft);color:var(--corail)}
.insight.signal::before{content:"◉";background:#DCE9F5;color:#2C5F8A}
.insight.lever::before{content:"⚿";background:var(--emeraude-soft);color:#0a6b53}
.insight:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}

/* — verbatims : guillemet décoratif — */
.vb{position:relative;padding-left:34px!important}
.vb::before{content:"“";position:absolute;left:10px;top:2px;font-family:'Fraunces';font-size:30px;line-height:1;color:var(--emeraude);opacity:.55}

/* — badges thèmes — */
.theme{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.theme:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(12,59,67,.10)}
.theme .tn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}

/* — tables — */
.tbl-wrap table{border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden}
.tbl-wrap thead th{background:var(--petrole-3)!important;color:#EAF4F1!important;font-weight:700;letter-spacing:.03em}
.tbl-wrap tbody tr:nth-child(even){background:#FAF8F2}
.tbl-wrap tbody tr{transition:background .15s}
.tbl-wrap tbody tr:hover{background:var(--emeraude-soft)}

/* — analysis & note-box — */
.analysis{border-left-width:4px;box-shadow:inset 0 1px 0 rgba(12,59,67,.03)}
.note-box{border-radius:12px}

/* — scrollbars du contenu — */
#main ::-webkit-scrollbar{width:9px;height:9px}
#main ::-webkit-scrollbar-thumb{background:#CFC8B8;border-radius:8px}
#main ::-webkit-scrollbar-thumb:hover{background:#B8B09C}

/* — bouton remonter — */
#toTop{position:fixed;right:22px;bottom:22px;z-index:80;width:44px;height:44px;border-radius:50%;border:none;background:var(--petrole);color:#fff;font-size:18px;cursor:pointer;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
#toTop.show{opacity:1;pointer-events:auto}
#toTop:hover{background:var(--emeraude)}

/* — bouton imprimer sidebar — */
.side-print{margin:10px 14px 0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#EAF4F1;padding:9px 12px;border-radius:11px;font-family:'Hanken Grotesk';font-weight:600;font-size:12.5px;cursor:pointer;width:calc(100% - 28px)}
.side-print:hover{background:var(--emeraude);border-color:var(--emeraude)}

/* — impression / export PDF — */
@media print{
  #sidebar,.topbar,#toTop,.side-print,button{display:none!important}
  #main{margin-left:0!important}
  .wrap{max-width:100%;padding:0 6mm}
  body{background:#fff;font-size:12px}
  .card,.kpi,.insight{box-shadow:none!important;border:1px solid #ddd;break-inside:avoid}
  .section{break-inside:avoid-page;margin:18px 0}
  .hero{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page-head h2{font-size:24px}
  a{text-decoration:none}
}

.acc{background:#fff;border:1px solid #E4DECF;border-radius:14px;margin:12px 0;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;padding:15px 18px;user-select:none;transition:background .15s}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:#FAF8F2}
.acc-ic{font-size:20px}
.acc-tt{font-weight:800;color:#11302c;font-size:14.5px;display:flex;flex-direction:column;gap:2px;flex:1;font-family:'Fraunces',serif}
.acc-tt small{font-weight:600;color:#8a978f;font-size:11.5px;letter-spacing:.02em;font-family:'Hanken Grotesk',sans-serif}
.acc-ch{color:#8a978f;transition:transform .2s;font-size:15px}
.acc[open] .acc-ch{transform:rotate(180deg)}
.acc[open] summary{border-bottom:1px solid #EFEADD}
.acc-body{padding:16px 18px 18px}
</style>
</head>

<script>
/* ============================================================
   GPECT ISSOUDUN 2026 — Dashboard (source unique = scripts pandas)
   Toutes les valeurs proviennent des rapports de résultats :
   02_analyse_entreprises.py / 05_analyse_of.py /
   08_analyse_acteurs.py / 11_analyse_syndicats.py
   ============================================================ */
const PAL={petrole:'#0C3B43',petrole2:'#114E58',emeraude:'#0FA37F',emeraude2:'#13BD92',ambre:'#E0A22B',ambre2:'#F2B544',corail:'#D2562F',ink:'#13211F',soft:'#9aa7a3',
  scale:['#0C3B43','#13718a','#0FA37F','#E0A22B','#D2562F']};
const chartReg=[];
function destroyCharts(){chartReg.forEach(c=>{try{c.destroy()}catch(e){}});chartReg.length=0;}

/* value-label plugin */
const VL={id:'vl',afterDatasetsDraw(ch,a,o){const{ctx}=ch;const horiz=ch.options.indexAxis==='y';ch.data.datasets.forEach((ds,di)=>{const m=ch.getDatasetMeta(di);if(m.hidden)return;m.data.forEach((el,i)=>{const v=ds.data[i];if(v==null||v==='')return;ctx.save();ctx.font='700 11px "Hanken Grotesk",sans-serif';ctx.fillStyle=o.color||'#33433f';ctx.textBaseline='middle';const lab=(o.fmt?o.fmt(v):v);if(horiz){ctx.textAlign='left';ctx.fillText(lab,el.x+6,el.y);}else{ctx.textAlign='center';ctx.fillText(lab,el.x,el.y-7);}ctx.restore();});});}};

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- chart factories ---- */
function hbar(container,{labels,values,values2,leg,leg2,unit='%',color,color2,max}){
  const h=Math.max(120,labels.length*(values2?40:30)+(values2?44:34));
  const wrap=el('div','chart-wrap');wrap.style.height=h+'px';
  const cv=el('canvas');wrap.appendChild(cv);container.appendChild(wrap);
  const ds=[{label:leg||'',data:values,backgroundColor:color||grad(cv,values,max),borderRadius:6,barPercentage:.78,categoryPercentage:.82}];
  if(values2)ds.push({label:leg2||'',data:values2,backgroundColor:color2||PAL.ambre,borderRadius:6,barPercentage:.78,categoryPercentage:.82});
  const fmt=unit==='%'?(v=>String(v).replace('.',',')+'%'):(unit==='/5'?(v=>Number(v).toFixed(1).replace('.',',')):(v=>v));
  const c=new Chart(cv,{type:'bar',data:{labels,datasets:ds},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:38}},
    plugins:{legend:{display:!!values2,position:'top',align:'end',labels:{boxWidth:12,boxHeight:12,font:{family:'Hanken Grotesk',size:12,weight:'600'},color:'#4A5754'}},
      tooltip:{callbacks:{label:c=>` ${c.dataset.label?c.dataset.label+': ':''}${fmt(c.parsed.x)}`}},vl:{fmt}},
    scales:{x:{beginAtZero:true,max:max||undefined,grid:{color:'#ECE7DB'},ticks:{font:{family:'Hanken Grotesk',size:11},color:'#9aa7a3',callback:v=>unit==='%'?v+'%':v}},
      y:{grid:{display:false},ticks:{font:{family:'Hanken Grotesk',size:12.3,weight:'600'},color:'#27433d',crossAlign:'far'}}}},plugins:[VL]});
  chartReg.push(c);return c;
}
function grad(cv,values,max){const top=Math.max(...values);return values.map(v=>{const r=v/(max||top||1);if(r>=.8)return PAL.petrole;if(r>=.55)return PAL.emeraude;if(r>=.32)return PAL.ambre;return '#b9c7c2';});}
function doughnut(container,{labels,values,unit='%'}){
  const wrap=el('div','chart-wrap');wrap.style.height='230px';wrap.style.display='flex';wrap.style.alignItems='center';
  const cv=el('canvas');wrap.appendChild(cv);container.appendChild(wrap);
  const cols=[PAL.petrole,PAL.emeraude,PAL.ambre,PAL.corail,PAL.petrole2,'#8FB7AE','#caa86a'];
  const c=new Chart(cv,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:cols,borderColor:'#fff',borderWidth:2.5,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:11,boxHeight:11,font:{family:'Hanken Grotesk',size:12,weight:'500'},color:'#27433d',padding:9}},
      tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed}${unit==='%'?'%':''}`}}}}});
  chartReg.push(c);return c;
}
function radar(container,{labels,sets,max=5}){
  const wrap=el('div','chart-wrap');wrap.style.height='340px';
  const cv=el('canvas');wrap.appendChild(cv);container.appendChild(wrap);
  const cols=[PAL.petrole,PAL.ambre,PAL.emeraude,PAL.corail];
  const ds=sets.map((s,i)=>({label:s.label,data:s.data,borderColor:cols[i%4],backgroundColor:cols[i%4]+'22',borderWidth:2,pointBackgroundColor:cols[i%4],pointRadius:3}));
  const c=new Chart(cv,{type:'radar',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'top',labels:{boxWidth:12,font:{family:'Hanken Grotesk',size:12,weight:'600'},color:'#27433d'}}},
    scales:{r:{min:0,max,ticks:{stepSize:1,font:{size:10},color:'#9aa7a3',backdropColor:'transparent'},grid:{color:'#E2DCCF'},angleLines:{color:'#E2DCCF'},pointLabels:{font:{family:'Hanken Grotesk',size:11.5,weight:'600'},color:'#27433d'}}}}});
  chartReg.push(c);return c;
}
/* ---- block renderers ---- */
function blockChartCard(b){
  const card=el('div','card');
  const head=el('div','ch-head');
  let q=`<div class="ch-q">`+(b.q?`<span class="qn">${esc(b.q)}</span>`:'')+(b.kind?`<span>${esc(b.kind)}</span>`:'')+(b.n!=null?`<span>n=${b.n}</span>`:'')+`</div>`;
  head.innerHTML=q+`<div class="ch-title">${esc(b.title)}</div>`+(b.note?`<div class="ch-note">${esc(b.note)}</div>`:'');
  card.appendChild(head);
  const host=el('div');card.appendChild(host);
  // defer chart creation until in DOM
  card._draw=()=>{
    try{
    if(typeof Chart==='undefined'){host.innerHTML='<div style="padding:16px;color:#9aa7a3;font-size:12.5px;text-align:center">📊 Graphique indisponible (librairie Chart.js non chargée — vérifiez la connexion internet).</div>';return;}
    if(b.type==='bars')hbar(host,{labels:b.items.map(i=>i.label),values:b.items.map(i=>i.v),values2:b.items.some(i=>i.v2!=null)?b.items.map(i=>i.v2):null,leg:b.leg,leg2:b.leg2,unit:b.unit||'%',max:b.max,color:b.color,color2:b.color2});
    else if(b.type==='scale')hbar(host,{labels:b.items.map(i=>i.label),values:b.items.map(i=>i.v),values2:b.items.some(i=>i.v2!=null)?b.items.map(i=>i.v2):null,leg:b.leg||'Moyenne',leg2:b.leg2,unit:'/5',max:5,color:b.color,color2:b.color2});
    else if(b.type==='doughnut')doughnut(host,{labels:b.items.map(i=>i.label),values:b.items.map(i=>i.v),unit:b.unit||'%'});
    else if(b.type==='radar')radar(host,{labels:b.labels,sets:b.sets,max:b.max||5});
    }catch(e){console.error('chart',e);host.innerHTML='<div style="padding:14px;color:#9aa7a3;font-size:12px">Graphique indisponible.</div>';}
  };
  if(b.legend){const lg=el('div','legend');lg.innerHTML=b.legend.map(l=>`<span><i style="background:${l.c}"></i>${esc(l.t)}</span>`).join('');card.appendChild(lg);}
  if(b.analysis){const a=el('div','analysis');a.innerHTML=b.analysis;card.appendChild(a);}
  if(b.src){const s=el('div','src');s.textContent=b.src;card.appendChild(s);}
  return card;
}
function kpiCard(k){const c=el('div','kpi '+(k.tone||''));c.innerHTML=`<div class="kv">${k.v}</div><div class="kl">${k.l}</div>`+(k.s?`<div class="ks">${k.s}</div>`:'');return c;}
function blockKpis(items){if(items.length===1)return kpiCard(items[0]);const g=el('div','grid g4');items.forEach(k=>g.appendChild(kpiCard(k)));return g;}
function blockInsight(b){const d=el('div','insight '+b.tone);const tags={gap:'Écart de perception',risk:'Risque 3-5 ans',signal:'Signal faible',lever:'Levier'};d.innerHTML=`<div class="ih"><span class="tag">${tags[b.tone]||''}</span><span>${esc(b.title)}</span></div><p>${b.text}</p>`;return d;}
function blockVerbatims(b){const w=el('div','card');
  const noteHtml=b.note?esc(b.note):(b.themes&&b.n!=null?`Chaque chiffre = <b>% des ${b.n} ${b.base||'répondants'}</b> ayant cité ce thème · plusieurs réponses possibles`:'');
  w.innerHTML=`<div class="ch-q">`+(b.q?`<span class="qn">${esc(b.q)}</span>`:'')+`<span>verbatims anonymisés</span>`+(b.n!=null?`<span>n=${b.n}</span>`:'')+`</div><div class="ch-title">${esc(b.title)}</div>`+(noteHtml?`<div class="ch-note">${noteHtml}</div>`:'');
  if(b.themes){const t=el('div','themes');t.style.margin='12px 0';t.innerHTML=b.themes.map(x=>`<span class="theme ${x.cls||''}"><span class="tn">${x.n}%</span>${esc(x.label)}</span>`).join('');w.appendChild(t);}
  const vg=el('div','vb-grid');vg.innerHTML=b.quotes.map(q=>`<div class="vb">${esc(q)}</div>`).join('');w.appendChild(vg);
  if(b.analysis){const a=el('div','analysis');a.innerHTML=b.analysis;w.appendChild(a);}return w;}
function blockText(b){const c=el('div','card');c.innerHTML=(b.title?`<div class="ch-title" style="margin-bottom:8px">${esc(b.title)}</div>`:'')+b.html;return c;}
function blockTable(b){const w=el('div','tbl-wrap');let h='<table><thead><tr>'+b.headers.map((x,i)=>`<th class="${i>0&&b.numCols!==false?'num':''}">${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  b.rows.forEach(r=>{h+='<tr>'+r.map((c,i)=>`<td class="${i>0&&b.numCols!==false?'num':''}">${c}</td>`).join('')+'</tr>';});h+='</tbody></table>';w.innerHTML=h;return w;}

/* render a list of blocks into a container, then draw charts */
function renderBlocks(host,blocks){
  blocks.forEach(b=>{
    if(b.type==='section'){const s=el('div','section');if(b.aid)s.id=b.aid;s.innerHTML=`<div class="section-title"><span class="st-num">${b.num||'•'}</span>${esc(b.title)}</div>`+(b.desc?`<div class="section-desc">${b.desc}</div>`:'');(host._acc||host).appendChild(s);return;}
    if(b.type==='accStart'){const d=document.createElement('details');d.className='acc';if(b.aid)d.id=b.aid;if(b.open)d.open=true;const su=document.createElement('summary');su.innerHTML=`<span class="acc-ic">${b.icon||'▸'}</span><span class="acc-tt">${esc(b.title)}${b.sub?`<small>${esc(b.sub)}</small>`:''}</span><span class="acc-ch">⌄</span>`;d.appendChild(su);const body=el('div','acc-body');d.appendChild(body);host.appendChild(d);host._acc=body;return;}
    if(b.type==='accEnd'){host._acc=null;return;}
    if(b.type==='gridStart'){const g=el('div','grid '+(b.cols||'g2'));g.dataset.grid='1';(host._acc||host).appendChild(g);host._cur=g;return;}
    if(b.type==='gridEnd'){host._cur=null;return;}
    let node;
    if(b.type==='bars'||b.type==='scale'||b.type==='doughnut'||b.type==='radar')node=blockChartCard(b);
    else if(b.type==='kpis')node=blockKpis(b.items);
    else if(b.type==='insight')node=blockInsight(b);
    else if(b.type==='verbatims')node=blockVerbatims(b);
    else if(b.type==='text')node=blockText(b);
    else if(b.type==='table'){node=el('div','');node.appendChild(b.title?(()=>{const t=el('div','ch-title');t.style.margin='2px 0 10px';t.textContent=b.title;return t;})():el('span'));node.appendChild(blockTable(b));}
    else if(b.type==='html'){node=el('div','');node.innerHTML=b.html;}
    if(!node)return;
    (host._cur||host._acc||host).appendChild(node);
    if(b.span2&&node.classList)node.classList.add('span2');
  });
  // draw charts after layout
  requestAnimationFrame(()=>{host.querySelectorAll('.card').forEach(c=>{if(c._draw){try{c._draw();}catch(e){console.error(e);}}});});
}
</script>
<script>
/* ===================== DATA ===================== */
const META={n_total:42, colleges:4};
const ENT={label:'Entreprises', n:21,
 headline:"Un socle industriel dynamique face à un choc démographique non anticipé",
 sub:"Tissu à dominante métallurgie/usinage : <b>95%</b> des entreprises en tension de recrutement, une dynamique d'investissement forte (71%) — mais un choc démographique et un déficit d'attractivité encore peu adressés.",
 blocks:[

  {type:'gridStart',cols:'g2'},

  {type:'gridEnd'},
  {type:'gridStart',cols:'g2'},
  {type:'bars',q:'Q1.5',n:21,title:"Recours à des ressources externes régulières",note:'% de répondants — choix multiple',items:[{label:'Intérim',v:71},{label:'Prestation industrielle / logistique',v:48},{label:'Aucun recours externe',v:24}],analysis:`<b>71% recourent à l'intérim</b> de façon régulière : l'intérim est un amortisseur structurel du tissu, ce qui explique le rôle clé des agences dans le collège « acteurs de l'emploi ».`},
  {type:'doughnut',q:'Q1.8',n:21,title:"Tranche d'âge du dirigeant / responsable de site",items:[{label:'45 à 54 ans',v:52},{label:'55 à 59 ans',v:19},{label:'Moins de 45 ans',v:19},{label:'60 ans et +',v:10}],analysis:`<b>29% des dirigeants ont 55 ans ou plus</b>. Couplé au faible taux de projets de transmission déclarés (19%, Q2.2), c'est un signal précoce sur la reprise d'entreprises à 5-10 ans.`},
  {type:'gridEnd'},

  {type:'section',num:'2',title:"Stratégie & anticipation",desc:"Une dynamique offensive (croissance, investissement) mais une anticipation RH partielle."},
  {type:'bars',q:'Q2.1',n:21,title:"3 préoccupations principales pour les 24 prochains mois",note:'% de répondants — 3 choix maximum',items:[{label:'Maintenir activité / compétitivité (coûts)',v:67},{label:'Recruter des collaborateurs qualifiés',v:62},{label:'Fidéliser les collaborateurs',v:48},{label:'Développer de nouveaux marchés',v:38},{label:'Transition écologique & énergétique',v:29},{label:"Investir / moderniser l'outil",v:24},{label:'Diversifier / nouveaux produits',v:14},{label:'Évolutions technos (Industrie 4.0, IA)',v:10},{label:'Préparer la transmission',v:5}],analysis:`Les deux premières préoccupations — <b>compétitivité-coûts (67%)</b> et <b>recrutement qualifié (62%)</b> — sont indissociables : sans compétences, pas de compétitivité. La transmission ferme la marche (5%), ce qui contraste fortement avec la réalité démographique (section 4).`},
  {type:'gridStart',cols:'g4'},
  {type:'doughnut',q:'Q2.3',n:21,title:"Évolution des effectifs d'ici 3 ans",items:[{label:'À la hausse',v:62},{label:'Stable',v:33},{label:'À la baisse',v:5}]},
  {type:'doughnut',q:'Q2.4',n:21,title:"Investissements majeurs d'ici 3 ans",items:[{label:'Oui, budgétés',v:62},{label:'Non',v:29},{label:"Oui, à l'étude",v:10}]},
  {type:'doughnut',q:'Q2.2',n:21,title:"Projet de transmission / cession d'ici 5 ans",items:[{label:'Non',v:81},{label:'Oui, défini / en cours',v:10},{label:'Oui, en réflexion',v:10}]},
  {type:'doughnut',q:'Q2.5',n:16,title:"Ces investissements exigent-ils de nouvelles compétences ?",items:[{label:'Non, compétences suffisantes',v:56},{label:'Oui, besoins de formation',v:44}]},
  {type:'gridEnd'},
  {type:'insight',tone:'signal',title:"Un angle mort potentiel entre investissement et compétences",text:`71% des entreprises investissent dans des machines, robots ou ERP, mais <b>56% estiment que les compétences actuelles suffiront</b> (Q2.5, n=16). Or moderniser l'outil sans plan de montée en compétences est un facteur d'échec classique des projets Industrie 4.0. <span class="hyp">hypothèse à vérifier en atelier</span>`},

  {type:'section',num:'3',title:"Métiers clés & tensions de recrutement",desc:"Le cœur du diagnostic : quels métiers, quelle intensité, quelles causes, quelle exposition au changement."},
  {type:'verbatims',q:'Q3.1',n:21,base:'entreprises',title:"Métiers clés ou en tension cités par les entreprises",themes:[{label:'Usinage / réglage CN / mécanique',n:33,cls:'hot'},{label:'Bureau études / méthodes / CAO',n:33,cls:'hot'},{label:'Encadrement / management',n:29,cls:'warm'},{label:'Qualité / contrôle / HSE',n:24,cls:'warm'},{label:'Conduite / transport',n:24,cls:'warm'},{label:'Maintenance',n:19},{label:'Logistique / cariste',n:19},{label:'Soudure / chaudronnerie',n:10}],quotes:["Règleur, contrôle qualité, technicien méthodes","Chef de projet BE, technicien BE, technicien méthodes industrialisation","Tech méthodes & ingénieurs, tech qualité, responsable QHSE, tech maintenance, responsable supply","Électromécanicien, opérateur logistique/cariste, opérateur de production"],analysis:`Les tensions se concentrent sur la <b>chaîne technique de l'usinage</b> (réglage CN, méthodes, qualité) et sur l'<b>encadrement de proximité</b>. <b>Usinage / réglage CN</b> arrive en tête (33% des entreprises). Ces familles se retrouvent chez les acteurs de l'emploi (maintenance/CNC à 4,9/5) et les syndicats (usinage/qualité 43%) : convergence forte.`},
  {type:'gridStart',cols:'g2'},
  {type:'doughnut',q:'Q3.2',n:21,title:"Ces métiers sont-ils en tension ?",items:[{label:'Oui, difficultés majeures',v:62},{label:'Oui, difficultés ponctuelles',v:33},{label:'Non, pas de tension',v:5}],analysis:`<b>95% en tension</b>, dont 62% en difficultés <b>majeures</b>. La tension n'est pas un risque futur : c'est la situation présente.`},
  {type:'doughnut',q:'Q3.4',n:21,title:'Métiers « sensibles » (disparition / transformation d\'ici 5 ans)',items:[{label:'Non, stabilité prévue',v:48},{label:'Oui, risque partiel',v:33},{label:'Oui, transformation profonde',v:19}],analysis:`<b>52% anticipent une transformation</b> (partielle ou profonde) de leurs métiers clés. La moitié du tissu se sait exposée au changement — une porte d'entrée pour la GPECT.`},
  {type:'gridEnd'},
  {type:'scale',q:'Q3.3',n:20,title:"Causes des tensions de recrutement",note:'note moyenne 1 (faible) → 5 (fort impact)',items:[{label:'Pénurie de candidats sur le marché local',v:4.5},{label:'Concurrence salariale autres entreprises/secteurs',v:3.7},{label:'Déficit d\'image du métier / secteur',v:3.2},{label:'Inadéquation des compétences / diplômes',v:3.1},{label:'Localisation de l\'entreprise',v:2.8},{label:'Transport',v:2.5},{label:'Délais de formation initiale trop longs',v:2.4},{label:'Logement',v:1.7},{label:'Emploi du conjoint',v:1.6},{label:'Garde d\'enfant',v:1.5}],analysis:`Pour les entreprises, la cause n°1 est la <b>pénurie de candidats (4,5/5)</b> — un problème perçu de <b>quantité</b>. À comparer avec les acteurs de l'emploi et les syndicats, qui pointent d'abord un déficit de <b>qualification</b> et de <b>savoirs de base</b> : même symptôme, diagnostic différent (voir Analyse croisée).`},
  {type:'scale',q:'Q3.5',n:13,title:"Facteurs de transformation des métiers",note:'note moyenne 1→5 · sous-échantillon n=13',items:[{label:'Changement attentes clients / marchés',v:3.5},{label:'Transition énergétique & décarbonation',v:3.5},{label:'Intégration de l\'IA dans les process',v:3.1},{label:'Évolution normes & réglementations',v:3.1},{label:'Automatisation & robotisation',v:2.8}],analysis:`La transformation est tirée par le <b>marché</b> et la <b>transition énergétique</b> autant que par la technologie. L'IA (3,1) progresse mais reste derrière les enjeux marché.`},

  {type:'section',num:'4',title:"Démographie, turnover & transmission",desc:"L'enjeu le plus structurant à 5 ans — et le plus sous-estimé par les répondants."},
  {type:'kpis',items:[
    {v:'47%',l:'de seniors (45 ans et +)',s:'pyramide des âges (Q4.1)',tone:'amber'},
    {v:'136',l:'départs retraite à 5 ans',s:'cumul déclaré (Q4.3)',tone:'coral'},
    {v:'81%',l:'turnover faible & maîtrisé',s:'ancienneté élevée (Q4.5)',tone:'emer'},
    {v:'1,0/5',l:'recours à l\'AFEST',s:'écart-type nul (Q4.8)',tone:'petrol'},
  ]},
  {type:'table',title:"Pyramide des âges — effet de poids du plus gros employeur (Q4.1)",headers:['Base','Têtes','<30 ans','31-44','45-59','60+','Seniors 45+','% femmes'],numCols:true,rows:[
    ['Avec plus gros employeur','3 031','18,0%','35,0%','41,7%','5,3%','<b>47,0%</b>','36,5%'],
    ['Sans plus gros employeur','1 506','20,9%','33,5%','39,5%','6,1%','<b>45,6%</b>','46,5%'],
  ]},
  {type:'gridStart',cols:'g2'},
  {type:'doughnut',q:'Q4.5',n:21,title:"Situation en matière de turnover",items:[{label:'Faible & maîtrisé',v:81},{label:'En augmentation sur certains postes',v:19}],analysis:`Un turnover faible est un <b>atout de fidélisation</b>… mais aussi un <b>piège cognitif</b> : il rassure et masque le mur des départs en retraite. C'est précisément cette stabilité qui explique le faible sentiment d'urgence sur la transmission.`},
  {type:'doughnut',q:'Q4.8b',n:21,title:"Besoin identifié en transmission des savoir-faire",items:[{label:'Non, dispositifs suffisants',v:67},{label:'Oui, besoin non traité',v:29},{label:'Aucun dispositif ni besoin',v:5}]},
  {type:'gridEnd'},
  {type:'bars',q:'Q4.4',n:20,title:"Services concentrant les départs en retraite",note:'% de répondants — choix multiple',items:[{label:'Production / fabrication',v:60},{label:'Logistique',v:25},{label:'Commerce / ADV',v:25},{label:'Conduite / transport',v:25},{label:'Qualité',v:15},{label:'Maintenance',v:15},{label:'Bureau d\'études',v:15},{label:'Management de proximité',v:15}],analysis:`Les départs frappent d'abord la <b>production (60%)</b> — là où se trouvent les savoir-faire techniques difficiles à remplacer. Le risque de perte de compétence est maximal sur le cœur de métier.`},
  {type:'scale',q:'Q4.8',n:21,title:"Maturité des dispositifs de transmission en place",note:'note moyenne 1 (pas du tout) → 5 (très bien outillé)',items:[{label:'Documentation des procédures',v:3.5},{label:'Formation interne structurée',v:3.3},{label:'Tutorat / binôme junior-senior',v:3.2},{label:'Dispositifs France Travail (POEI, PMSMP)',v:2.1},{label:'AFEST (formation en situation de travail)',v:1.0}],analysis:`Les entreprises transmettent « à l'ancienne » (doc, tutorat). Les dispositifs <b>outillés et finançables</b> sont sous-mobilisés : France Travail à 2,1 et surtout <b>AFEST à 1,0/5 (écart-type nul : personne ne l'utilise)</b>. Or l'AFEST est l'outil le plus adapté à la transmission de gestes techniques en production. Levier d'action immédiat.`},
  {type:'scale',q:'Q4.7',n:21,title:"Motifs de départ des salariés",note:'note moyenne 1→5',items:[{label:'Départ vers la concurrence',v:2.8},{label:'Rémunération & avantages',v:2.7},{label:'Conditions de travail',v:2.4},{label:'Qualité de vie / équilibre',v:2.2},{label:'Autre secteur',v:2.1},{label:'Horaires',v:2.0},{label:'Pénibilité',v:2.0},{label:'Manque de perspectives',v:1.9}],analysis:`Tous les motifs restent <b>sous 3/5</b> : cohérent avec un turnover faible. Quand un départ survient, c'est d'abord <b>la concurrence locale</b> et <b>la rémunération</b> — un signal de concurrence salariale entre employeurs du bassin.`},

  {type:'section',num:'5',title:"Recrutement",desc:"Une activité de recrutement quasi systématique, difficile, tirée par le remplacement des départs."},
  {type:'gridStart',cols:'g4'},
  {type:'doughnut',q:'Q5.1',n:21,title:'Recrutements en 2024-2025',items:[{label:'Oui',v:95},{label:'Non',v:5}]},
  {type:'kpis',items:[{v:'3,8/5',l:'Difficulté de recrutement ressentie',s:'Q5.2 · n=20',tone:'coral'}]},
  {type:'kpis',items:[{v:'131',l:'recrutements prévus à 3 ans',s:'cumul · médiane 5 (Q5.4)',tone:'emer'}]},
  {type:'kpis',items:[{v:'76%',l:'pour remplacer des départs retraite',s:'1ère motivation (Q5.5)',tone:'amber'}]},
  {type:'gridEnd'},
  {type:'scale',q:'Q5.3',n:21,title:"Freins au recrutement",note:'note moyenne 1→5',items:[{label:'Manque de candidats sur le marché local',v:4.3},{label:'Concurrence d\'autres employeurs locaux',v:3.2},{label:'Inadéquation compétences / diplômes',v:2.8},{label:'Prétentions salariales trop élevées',v:2.8},{label:'Déficit d\'image de l\'entreprise/secteur',v:2.7},{label:'Mobilité (transports, véhicule)',v:2.1},{label:'Logement',v:1.4},{label:'Emploi du conjoint',v:1.4}],analysis:`Le <b>manque de candidats (4,3)</b> domine très nettement, loin devant l'inadéquation des compétences (2,8). Confirme la lecture « pénurie » côté entreprises.`},
  {type:'gridStart',cols:'g2'},
  {type:'bars',q:'Q5.5',n:21,title:"Motivation des futurs recrutements",note:'% de répondants — choix multiple',items:[{label:'Remplacement départs retraite',v:76},{label:'Accroissement de l\'activité',v:62},{label:'Remplacement départs volontaires',v:43},{label:'Lancement nouvelle activité',v:5}],analysis:`Le recrutement est d'abord <b>défensif</b> (remplacer les retraites, 76%), ce qui reconnecte au choc démographique : recruter ne suffira pas, il faut aussi <b>transmettre</b>.`},
  {type:'bars',q:'Q5.6',n:21,title:"Actions d'attractivité déjà mises en place",note:'% de répondants — choix multiple',items:[{label:'Relations écoles / CFA / lycées',v:81},{label:'Communication réseaux sociaux',v:76},{label:'Partenariat France Travail / ML / Cap Emploi',v:71},{label:'Portes ouvertes / visites',v:48},{label:'Ambassadeurs métiers',v:24},{label:'Aucune action',v:5}],analysis:`Le tissu est déjà <b>actif et outillé</b> (écoles 81%, réseaux sociaux 76%). Les marges sont moins sur « faire » que sur <b>mutualiser et coordonner</b> ces actions à l'échelle du bassin.`},
  {type:'gridEnd'},

  {type:'section',num:'6',title:"Compétences",desc:"Des compétences globalement adaptées mais avec des lacunes ciblées, et un cap clair vers l'IA et l'énergie."},
  {type:'gridStart',cols:'g2'},
  {type:'doughnut',q:'Q6.1',n:21,title:"Compétences techniques adaptées aux besoins actuels ?",items:[{label:'Plutôt, avec quelques lacunes',v:62},{label:'Tout à fait adaptées',v:33},{label:'Plutôt inadaptées',v:5}]},
  {type:'doughnut',q:'Q6.3',n:21,title:"Compétences comportementales (savoir-être) adaptées ?",items:[{label:'Plutôt adaptées',v:67},{label:'Tout à fait',v:24},{label:'Plutôt inadaptées',v:10}]},
  {type:'gridEnd'},
  {type:'bars',q:'Q6.2',n:21,title:"Compétences techniques qui manquent le plus aujourd'hui",note:'% de répondants — choix multiple',items:[{label:'Qualité, contrôle & métrologie',v:43},{label:'Management & gestion d\'équipe',v:33},{label:'Maintenance industrielle & automatismes',v:29},{label:'CAO / DAO / lecture de plans',v:29},{label:'Aucun manque identifié',v:24},{label:'Logistique / supply chain',v:19},{label:'Compétences commerciales',v:19},{label:'Usinage / mécanique',v:14},{label:'Programmation machines (CNC, automates)',v:14},{label:'Numérique industriel (ERP/GPAO)',v:14}],analysis:`Le manque n°1 est la <b>qualité/métrologie (43%)</b>, suivi du <b>management (33%)</b> : deux compétences « pivots » qui sécurisent la production et encadrent les équipes vieillissantes.`},
  {type:'gridStart',cols:'g2'},
  {type:'bars',q:'Q6.4',n:11,title:"Savoir-être à renforcer",note:'% de répondants — sous-échantillon n=11',items:[{label:'Rigueur & respect des procédures',v:91},{label:'Culture sécurité & vigilance',v:45},{label:'Autonomie & initiative',v:36},{label:'Travail en équipe',v:36},{label:'Engagement & responsabilité',v:36}],analysis:`Sur le sous-ensemble concerné, la <b>rigueur/respect des procédures (91%)</b> écrase tout : enjeu d'intégration et de culture industrielle plus que de personnalité.`},
  {type:'bars',q:'Q6.5',n:21,title:"Compétences à développer d'ici 3-5 ans",note:'% de répondants — choix multiple',items:[{label:'Intelligence artificielle',v:38},{label:'Transition énergétique & décarbonation',v:33},{label:'Transmission des savoir-faire & tutorat',v:33},{label:'Animation d\'équipes (agile/projet)',v:29},{label:'Automatisation, cobotique',v:24},{label:'Cybersécurité industrielle',v:24},{label:'Conduite du changement',v:24},{label:'Outils numériques collaboratifs',v:24}],analysis:`L'<b>IA arrive en tête (38%)</b> des compétences d'avenir, devant la transition énergétique et la transmission. La demande existe — reste l'offre locale, quasi absente sur ces sujets (voir collège Organismes de formation).`},
  {type:'gridEnd'},

  {type:'section',num:'7',title:"Formation & coopération",desc:"Une culture formation mature côté financement, mais une coopération avec les acteurs de l'emploi à structurer."},
  {type:'gridStart',cols:'g2'},
  {type:'doughnut',q:'Q7.2',n:21,title:"Connaissance des droits de financement (OPCO)",items:[{label:'Oui, mobilisés régulièrement',v:90},{label:'Non, dispositifs mal connus',v:10}],analysis:`<b>90% mobilisent leur OPCO</b> : la maturité « financement formation » est élevée. Le frein n'est donc pas l'argent de la formation, mais l'<b>ingénierie</b> et la <b>disponibilité</b>.`},
  {type:'doughnut',q:'Q7.4',n:21,title:"Recours à l'alternance",items:[{label:'Oui, régulièrement',v:76},{label:'Non, pas envisagé',v:14},{label:'Non, mais ouverts',v:10}]},
  {type:'bars',q:'Q7.1',n:21,title:"Formations organisées (2 dernières années)",note:'% de répondants — choix multiple',items:[{label:'Développement des compétences métiers',v:90},{label:'Obligatoires (sécurité, habilitations)',v:71},{label:'Management & développement personnel',v:29}],analysis:`<b>90% forment au métier</b> au-delà des seules obligations : la culture formation est réelle. Le <b>management</b> reste le parent pauvre (29%), alors qu'il figure parmi les compétences les plus manquantes (Q6.2 : 33%).`},
  {type:'doughnut',q:'Q7.5',n:18,title:"Les alternants sont-ils issus du territoire ?",items:[{label:'Oui, majoritairement',v:50},{label:'Partiellement',v:28},{label:'Non, autres territoires',v:22}],analysis:`La moitié des alternants viennent du bassin ; <b>50% en partie ou hors territoire</b> : un vivier local de jeunes à consolider (lien écoles, orientation).`},
  {type:'gridEnd'},
  {type:'bars',q:'Q7.3',n:21,title:"Freins à la formation",note:'% de répondants — choix multiple',items:[{label:'Difficulté à libérer les salariés',v:38},{label:'Coût pédagogique trop élevé',v:29},{label:'Aucun frein particulier',v:29},{label:'Faible appétence des salariés',v:24},{label:'Absence de formation adaptée localement',v:14},{label:'Manque de temps pour organiser',v:14}],analysis:`Le frein n°1 est <b>organisationnel</b> (libérer les salariés, 38%), pas financier. D'où l'intérêt des formats <b>en situation de travail (AFEST)</b> et <b>courts</b>, qui ne désorganisent pas la production.`},
  {type:'gridStart',cols:'g2'},
  {type:'doughnut',q:'Q7.8',n:21,title:"Coopération avec les acteurs de l'emploi locaux",items:[{label:'Faible & ponctuelle',v:43},{label:'Régulière & structurée',v:38},{label:'Aucune coopération',v:19}],analysis:`<b>62% des entreprises ont une coopération faible ou nulle</b> avec France Travail, Mission Locale, Cap Emploi… Un gisement d'efficacité immédiat, d'autant que ces acteurs se disent très disponibles (collège dédié).`},
  {type:'kpis',items:[{v:'3,1/5',l:"Offre de formation locale jugée adaptée",s:'Q7.6 · note tiède, médiane 3',tone:'amber'}]},
  {type:'gridEnd'},
  {type:'scale',q:'Q7.9',n:21,title:"Attentes vis-à-vis des acteurs de l'emploi",note:'note moyenne 1→5',items:[{label:'Job datings & forums de recrutement',v:3.3},{label:'Découverte des métiers auprès des scolaires',v:3.2},{label:'Diffusion & présélection des offres',v:3.1},{label:'Parcours de pré-qualification (profils sans expérience)',v:2.8},{label:'Suivi post-recrutement / intégration',v:2.7},{label:'Partage de viviers entre entreprises',v:2.6},{label:'Parcours de formation sur mesure (CQP, titres pro)',v:2.5}],analysis:`Les attentes restent <b>modérées (toutes ≤ 3,3)</b> : reflet d'une coopération encore distante. Les entreprises attendent surtout du <b>sourcing</b> (job datings, scolaires, offres) plus que de l'ingénierie de parcours — un signe qu'elles n'imaginent pas encore ce que la coopération pourrait produire.`},

  {type:'section',num:'8',title:"Territoire & attractivité",desc:"Le point noir le plus net du diagnostic, et paradoxalement le plus mobilisateur."},
  {type:'bars',q:'Q8.1',n:21,title:"Freins territoriaux au recrutement / à la fidélisation",note:'% de répondants — choix multiple',items:[{label:'Image du territoire peu attractive',v:95},{label:'Offre de soins / santé insuffisante',v:67},{label:'Transports en commun / mobilité',v:38},{label:'Services à la personne (crèches, gardes)',v:24},{label:'Offre de logement insuffisante/chère',v:14},{label:'Animation culturelle / loisirs',v:14}],analysis:`L'<b>image du territoire (95%)</b> est le frein le plus partagé de tout le diagnostic, suivie de la <b>désertification médicale (67%)</b>. Deux sujets qui dépassent l'entreprise et appellent une réponse <b>collective et territoriale</b>.`},
  {type:'gridStart',cols:'g2'},
  {type:'kpis',items:[{v:'2,3/5',l:"Image d'Issoudun auprès des candidats",s:'Q8.2 · parmi les plus basses du diagnostic (max observé : 3)',tone:'coral'}]},
  {type:'kpis',items:[{v:'76%',l:'prêts à une campagne de communication territoriale commune',s:'Q8.3 · 1ère action collective plébiscitée',tone:'emer'}]},
  {type:'gridEnd'},
  {type:'bars',q:'Q8.3',n:21,title:"Actions collectives territoriales : disposition à s'engager",note:'% de répondants — choix multiple',items:[{label:'Campagne de communication territoriale',v:76},{label:'Promotion des métiers (scolaires)',v:67},{label:'Ateliers inter-entreprises RH',v:62},{label:'Visites / portes ouvertes coordonnées',v:57},{label:'Plateforme de recrutement mutualisée',v:52},{label:'Groupement d\'employeurs (temps partagé)',v:29},{label:'Pas d\'intérêt actuellement',v:5}],analysis:`Contraste fécond : l'image est mauvaise (2,3/5) <b>mais la volonté d'agir ensemble est forte</b> — 5 actions sur 6 dépassent 50% d'adhésion. La matière première d'un plan collectif est là.`},

  {type:'section',num:'9',title:"Priorités GPECT",desc:"Ce que les entreprises attendent en premier de la démarche."},
  {type:'scale',q:'Q9.1',n:21,title:"Priorités d'action GPECT (hiérarchisées)",note:'note moyenne 1 (faible) → 5 (très haute priorité)',items:[{label:'Attractivité du territoire & communication',v:3.9},{label:'Connaissance du marché du travail & métiers en tension',v:3.3},{label:'Aide au recrutement & sourcing',v:2.8},{label:'Développement de l\'alternance & liens écoles',v:2.8},{label:'Transition numérique & Industrie 4.0',v:2.7},{label:'Développement de l\'offre de formation locale',v:2.6},{label:'Mutualisation inter-entreprises',v:2.5},{label:'Gestion des seniors & transmission',v:2.5}],analysis:`L'<b>attractivité (3,9)</b> et la <b>connaissance du marché (3,3)</b> dominent. À l'inverse, <b>seniors/transmission ferme la marche (2,5)</b> : c'est l'illustration la plus nette du décalage entre la priorité perçue et l'enjeu réel mesuré en section 4. Le rôle du diagnostic est de réintroduire ce sujet.`},
  {type:'gridStart',cols:'g2'},
  {type:'bars',q:'Q9.2',n:21,title:"Ateliers de co-construction : thèmes souhaités",note:'% de répondants — choix multiple',items:[{label:'Attractivité & recrutement territorial',v:48},{label:'Métiers sensibles & compétences clés',v:38},{label:'Ne souhaite pas participer',v:33},{label:'Transmission savoir-faire & seniors',v:14},{label:'Industrie 4.0 & compétences de demain',v:14}],analysis:`<b>33% ne souhaitent pas participer</b> : à prendre au sérieux. La mobilisation devra être « gagnée » par des formats utiles et courts, pas présupposée.`},

    {type:'gridStart',cols:'g2'},
    {type:'text',title:'Une donnée traçable, anonymisée, produite par script',html:`<p style="font-size:13.8px;color:#33433f">Chaque chiffre de ce tableau de bord provient d'un <b>fichier de résultats unique</b> produit par des scripts d'analyse (pandas), question par question, colonne par colonne. Aucune valeur n'est recalculée à la main, aucune entreprise n'est nommée. Les identifiants restent agrégés.</p><div class="legend" style="margin-top:12px"><span><i style="background:var(--petrole)"></i>Impact / fréquence fort</span><span><i style="background:var(--emeraude)"></i>Moyen-fort</span><span><i style="background:var(--ambre)"></i>Moyen</span><span><i style="background:#b9c7c2"></i>Faible</span></div>`},
    {type:'text',title:'Prudence sur les petits effectifs',html:`<p style="font-size:13.8px;color:#33433f">Trois collèges comptent <b>n=7 répondants</b>. Les pourcentages y sont des <b>ordres de grandeur</b> : nous affichons systématiquement l'effectif brut (n) à côté. Les croisements fins et corrélations sont présentés comme des <b>hypothèses à vérifier</b>, jamais comme des faits. Le collège Entreprises (n=21) supporte une lecture plus assurée.</p>`},
    {type:'gridEnd'},

    {type:'section',num:'ⓘ',title:'Précautions de lecture',desc:"Quelques repères méthodologiques pour interpréter correctement les chiffres de ce diagnostic."},
    {type:'html',html:`<div class="card"><div style="display:grid;gap:10px">
      <div class="mline"><span class="mk" style="min-width:160px">Échantillon</span><span class="mv">42 répondants. Trois collèges sont à <b>n=7</b> : leurs résultats se lisent en <b>ordres de grandeur</b> (1 répondant ≈ 14 points de %). Le collège Entreprises (n=21) autorise une lecture plus assurée.</span></div>
      <div class="mline"><span class="mk" style="min-width:160px">Plus gros employeur</span><span class="mv">Un établissement d'environ <b>1 550 salariés</b> pèse fortement sur les agrégats : les calculs sensibles sont présentés <b>avec et sans</b> cet employeur. Pyramide des âges calculée hors saisies incohérentes.</span></div>
      <div class="mline"><span class="mk" style="min-width:160px">Perceptions</span><span class="mv">Réponses déclaratives et auto-évaluées ; les <b>écarts entre collèges</b> sont un résultat à interpréter, non la mesure d'une réalité unique.</span></div>
      <div class="mline"><span class="mk" style="min-width:160px">Lecture des %</span><span class="mv">Choix multiples = « % de répondants » (somme &gt; 100% normale) ; arrondis à l'entier (un total peut afficher 99 ou 101%) ; les graphiques affichent les <b>principaux items</b> de chaque question.</span></div>
      <div class="mline"><span class="mk" style="min-width:160px">Verbatims & hypothèses</span><span class="mv">Citations <b>anonymisées</b>, à titre illustratif ; les rapprochements et corrélations sont des <b>hypothèses à vérifier</b>, jamais des faits établis.</span></div>
    </div></div>`},

  renderBlocks(host,[
    {type:'html',html:`<div class="note-box" style="margin-bottom:4px"><b>Source officielle.</b> Toutes les données de cette page proviennent du portail public <b>Data Emploi de France Travail</b> (territoire : CC du Pays d'Issoudun, comparé à la France). Les chiffres « emploi salarié » portent sur les salariés du territoire — ils diffèrent volontairement des « effectifs des 21 entreprises » de l'onglet Entreprises (bases et périmètres différents).</div>`},

    {type:'section',num:'1',title:`L'essentiel en 6 repères`,desc:`Ce qui distingue le bassin d'emploi d'Issoudun de la moyenne nationale, en moins de 30 secondes.`},
    {type:'kpis',items:[
      {v:'7,2%',l:`taux de chômage (Indre)`,s:`France : 7,9% — un peu plus bas (T4 2025)`,tone:'emer'},
      {v:'43%',l:`des habitants ont 55 ans et plus`,s:`France : 33% — population plus âgée`,tone:'coral'},
      {v:'63%',l:`des salariés dans l'industrie`,s:`France : 19% — plus de 3× la moyenne`,tone:'petrol'},
      {v:'66%',l:`de la population a un niveau ≤ CAP/BEP`,s:`France : 50% — territoire moins diplômé`,tone:'amber'},
      {v:'18 899',l:`habitants (Pays d'Issoudun)`,s:`−2,1% depuis 2020 · 8 153 actifs · 7 151 salariés`,tone:'petrol'},
      {v:'+2,2%',l:`d'emploi salarié en un an (2022→2023)`,s:`l'emploi progresse malgré la baisse démographique`,tone:'emer'},
    ]},

    {type:'section',num:'2',title:`Une population nettement plus âgée`,desc:`Répartition des habitants par tranche d'âge : beaucoup moins de jeunes, beaucoup plus de 55 ans et plus.`},
    {type:'bars',q:`INSEE 2021`,title:`Répartition des habitants par âge (%)`,note:`bleu = Pays d'Issoudun · orange = France`,unit:'%',max:50,leg:`Pays d'Issoudun`,leg2:`France`,color:PAL.petrole,color2:PAL.ambre,legend:LEGBF,
      items:[{label:`15–24 ans`,v:9.4,v2:12},{label:`25–34 ans`,v:9.2,v2:12},{label:`35–49 ans`,v:16,v2:19},{label:`50–54 ans`,v:8.2,v2:6.7},{label:`55 ans et plus`,v:43,v2:33}],

    {type:'insight',tone:'gap',title:`Un problème de qualité, pas seulement de quantité`,text:`Les candidats locaux cherchent surtout des postes <b>peu qualifiés</b> (libre-service, manutention, préparation de commandes) où les offres sont rares. Les recruteurs, eux, cherchent des profils <b>techniques et qualifiés</b> (infirmier, tourneur-fraiseur, technicien méthodes, ingénieur R&D) pour lesquels il n'y a presque <b>aucun candidat</b>. C'est exactement l'écart « pénurie de candidats » (vu par les entreprises) vs « déficit de qualification » (vu par les acteurs de l'emploi) — objectivé par France Travail.`},

      analysis:`Les plus gros volumes d'embauches sont dans les <b>services administratifs (+40%)</b> et la <b>santé (+44%)</b>, en forte hausse. L'industrie manufacturière reste un employeur clé (210) mais recule légèrement (−4,6%).`,src:`France Travail — Data Emploi, Acoss & MSA (T3 2025)`},
    {type:'doughnut',q:`Acoss & MSA`,title:`Nature des embauches`,items:[{label:`CDD de moins d'1 mois`,v:70},{label:`CDI`,v:17},{label:`CDD de plus de 6 mois`,v:9},{label:`CDD de 1 à 6 mois`,v:4}],analysis:`<b>70% des embauches sont des CDD de moins d'un mois</b> (65% en France) : un marché du travail local très rotatif, où les contrats stables (CDI : 17%) restent minoritaires. La tension ne vient pas d'un manque d'embauches, mais de leur précarité et de l'inadéquation des profils.`,src:`France Travail — Data Emploi (T3 2025)`},

const NAV=[
  {id:'accueil',label:"Accueil",ic:'◆',group:'Synthèse'},
  {id:'national',label:"Bassin d'emploi vs France",ic:'📍',group:'Synthèse'},
  {id:'entreprises',label:'Entreprises',ic:'🏭',badge:'21',group:'Les 4 collèges'},
  {id:'of',label:'Organismes de formation',ic:'🎓',badge:'7',group:'Les 4 collèges'},
  {id:'acteurs',label:"Acteurs de l'emploi",ic:'🤝',badge:'7',group:'Les 4 collèges'},
  {id:'syndicats',label:'Syndicats & org. pro.',ic:'⚖️',badge:'7',group:'Les 4 collèges'},
  {id:'croise',label:'Analyse croisée',ic:'🔀',group:'Synthèse territoriale'},
  {id:'leviers',label:'Leviers stratégiques',ic:'🗝️',group:'Synthèse territoriale'},
  {id:'plan',label:"Plan d'action",ic:'🎯',group:'Synthèse territoriale'},
];
function buildNav(){const nav=document.getElementById('nav');let lastG=null;NAV.forEach(it=>{if(it.group!==lastG){nav.appendChild(el('div','nav-group',it.group));lastG=it.group;}
  const a=el('div','nav-item');a.id='nav-'+it.id;a.innerHTML=`<span class="ni-ic">${it.ic}</span><span>${it.label}</span>`+(it.badge?`<span class="ni-badge">n=${it.badge}</span>`:'')+(it.soon?`<span class="soon">à venir</span>`:'');a.onclick=()=>go(it.id);nav.appendChild(a);});}
function go(id){location.hash=id;}
function goAnchor(id){const t=document.getElementById(id);if(!t)return;if(t.tagName==='DETAILS')t.open=true;t.scrollIntoView({behavior:'smooth'});}
function render(){
  const id=(location.hash||'#accueil').slice(1);
  const page=document.getElementById('page');destroyCharts();page.innerHTML='';window.scrollTo(0,0);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navi=document.getElementById('nav-'+id);if(navi)navi.classList.add('active');
  const host=el('div','fade');host._cur=null;page.appendChild(host);
  if(id==='accueil')pageAccueil(host);
  else if(id==='entreprises')pageCollege(host,ENT);
  else if(id==='of')pageCollege(host,OF);
  else if(id==='acteurs')pageCollege(host,ACT);
  else if(id==='syndicats')pageCollege(host,SYN);
  else if(id==='croise'&&PAGES_EXTRA.croise)PAGES_EXTRA.croise(host);
  else if(id==='leviers'&&PAGES_EXTRA.leviers)PAGES_EXTRA.leviers(host);
  else if(id==='plan'&&PAGES_EXTRA.plan)PAGES_EXTRA.plan(host);
  else if(id==='national'&&PAGES_EXTRA.national)PAGES_EXTRA.national(host);
  else pageAccueil(host);
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');
}
window.addEventListener('hashchange',render);
document.getElementById('hamb').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('backdrop').classList.toggle('show');};
document.getElementById('backdrop').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');};
try{buildNav();}catch(e){console.error('buildNav',e);}
try{render();}catch(e){console.error('render',e);var _p=document.getElementById('page');if(_p)_p.innerHTML='<div style="padding:24px;margin:18px;border:2px solid #D2562F;border-radius:12px;background:#fff;font:13px/1.6 ui-monospace,monospace;color:#b00;white-space:pre-wrap">⚠ Erreur de rendu : '+((e&&e.message)||e)+'</div>';}
</script>
